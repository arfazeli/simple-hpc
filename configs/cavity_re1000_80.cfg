# 80x80 cavity, Re 1000, all SPEC 3.1 defaults
N_cells_x = 80
N_cells_y = 80
Re = 1000
maxit = 15000
convection_scheme = QUICK
diffusion_order = 4
N_halo_x = 2
N_halo_y = 2
maxit_inner_u = 4
maxit_inner_v = 4
maxit_inner_p = 8
error_tolerance = 0.0001
relaxation_factor_u = 0.3
relaxation_factor_v = 0.3
relaxation_factor_p = 0.2
Hybrid_switch = False
backend = serial
momentum_solver = gs_lex
pressure_solver = gs_lex
output_dir = results/cavity_re1000_80
